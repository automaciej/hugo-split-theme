<div class="split-intro">
  {{ if .Title }}
  <h1>
    {{ range .Ancestors.Reverse }}
      <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
      &#187;
    {{ end }}
    {{ .Title }}
  </h1>
  {{ end }}
  {{ if .Params.tagline }}<h2 class="tagline">{{ .Params.tagline }}</h2>
  {{- else if .Title  -}}
  <h2 class="title">{{ .Title }}<h2>
  {{- end }}
</div>
