{{ define "main" }}

<div class="split-bio">
{{ .Content }}

<ul class="page-list split-list">
  {{ range .Pages }}
  <li>
    <a href="{{ .RelPermalink }}" title="{{ .Description }}">
      <div class="page-list-date">
      {{ .Date | time.Format ":date_medium" }}
      </div>
      <div class="page-list-title">
      {{ .LinkTitle }}
      </div>
    </a>
  </li>
  {{ end }}
</ul>

</div><!-- split-bio -->

{{ end }}
